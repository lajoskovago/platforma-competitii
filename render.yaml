# Render Blueprint – https://render.com/docs/blueprint-spec
# Next.js app (server-rendered, server actions). Database & auth live in Supabase.
services:
  - type: web
    name: competitii-regiunea5
    runtime: node
    region: frankfurt          # same region as the Supabase project (eu-central-1)
    plan: free                 # free sleeps after 15 min idle (~1 min cold start); "starter" stays awake
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start    # next start listens on $PORT provided by Render
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Set these in the Render dashboard (Supabase → Project Settings → API keys).
      # NEXT_PUBLIC_* values are baked in at build time: redeploy after changing them.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional: public address, e.g. https://competitii-regiunea5.onrender.com
      # (redirects otherwise use the proxy's forwarded host)
      - key: SITE_URL
        sync: false
